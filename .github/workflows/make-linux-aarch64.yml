name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build-linux-aarch64:
    name: Build Linux (aarch64)
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Linux ARM64 core
        run: bash ./build-linux-aarch64.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mupen64plus_next_libretro-linux-aarch64
          path: ./mupen64plus_next_libretro.so

